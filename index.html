<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ball Battle Simulator - Full Update</title>
<style>
:root {
--bg-main: #2b1d14;
--panel-bg: #3d2b1f;
--paper-bg: #f5e6ca;
--paper-line: #d4b896;
--accent-orange: #d96b27;
--accent-red: #c0392b;
--accent-gold: #f39c12;
--text-dark: #3a2518;
--text-light: #f3e5ab;
}
* {
box-sizing: border-box;
user-select: none;
margin: 0;
padding: 0;
}
body {
background-color: var(--bg-main);
color: var(--text-light);
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
overflow: hidden;
}
#game-container {
position: relative;
width: 1000px;
height: 680px;
background: #1e130c;
border: 4px solid #5c3a21;
border-radius: 12px;
box-shadow: 0 10px 30px rgba(0,0,0,0.8);
overflow: hidden;
}
canvas {
display: block;
background: #140d08;
}
/* OVERLAYS & PANELS */
.overlay {
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
background: rgba(20, 10, 5, 0.85);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 10;
}
.hidden { display: none !important; }
h1, h2, h3 {
color: var(--accent-gold);
text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
margin-bottom: 15px;
}
.btn {
background: linear-gradient(180deg, #d96b27, #a04010);
color: #fff;
border: 2px solid #ff9d5c;
padding: 10px 24px;
font-size: 16px;
font-weight: bold;
border-radius: 8px;
cursor: pointer;
transition: transform 0.1s, filter 0.2s;
box-shadow: 0 4px 8px rgba(0,0,0,0.4);
margin: 5px;
}
.btn:hover {
filter: brightness(1.15);
transform: translateY(-2px);
}
.btn:active {
transform: translateY(1px);
}
/* SELECTION SCREEN */
.mode-select {
display: flex;
gap: 15px;
margin-bottom: 20px;
}
.team-select-container {
display: flex;
gap: 30px;
margin-bottom: 20px;
}
.team-box {
background: var(--panel-bg);
border: 2px solid #6e472b;
border-radius: 8px;
padding: 15px;
width: 320px;
text-align: center;
}
.ball-picker-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
margin-top: 10px;
max-height: 220px;
overflow-y: auto;
padding: 5px;
}
.ball-card {
background: #271a12;
border: 2px solid #4a301e;
border-radius: 6px;
padding: 8px;
cursor: pointer;
font-size: 12px;
transition: all 0.2s;
}
.ball-card:hover {
border-color: var(--accent-gold);
background: #382417;
}
.ball-card.selected {
border-color: #27ae60;
background: #1e3d29;
box-shadow: 0 0 8px #27ae60;
}
/* HUD TOP BAR */
#hud {
position: absolute;
top: 10px;
left: 10px;
right: 10px;
display: flex;
justify-content: space-between;
pointer-events: none;
z-index: 5;
}
.team-hud {
background: rgba(30, 20, 14, 0.85);
border: 2px solid #5c3a21;
border-radius: 8px;
padding: 8px 15px;
min-width: 280px;
color: #fff;
}
.hp-bar-bg {
width: 100%;
height: 16px;
background: #333;
border-radius: 8px;
overflow: hidden;
margin-top: 4px;
border: 1px solid #666;
position: relative;
}
.hp-bar-fill {
height: 100%;
background: linear-gradient(90deg, #e74c3c, #2ecc71);
width: 100%;
transition: width 0.2s ease;
}
.hp-text {
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
font-size: 11px;
line-height: 16px;
text-align: center;
font-weight: bold;
color: #fff;
text-shadow: 1px 1px 2px #000;
}
/* POST-MATCH NOTEBOOK STATS BOARD */
.notebook-modal {
background: var(--paper-bg);
color: var(--text-dark);
width: 780px;
max-height: 580px;
border-radius: 12px;
border: 6px solid #8c5a32;
box-shadow: 0 15px 35px rgba(0,0,0,0.9);
padding: 25px;
position: relative;
background-image: repeating-linear-gradient(var(--paper-bg) 0px, var(--paper-bg) 24px, var(--paper-line) 25px);
font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
overflow-y: auto;
}
.notebook-title {
text-align: center;
color: #633816;
font-size: 26px;
font-weight: bold;
border-bottom: 3px dashed #8c5a32;
padding-bottom: 8px;
margin-bottom: 20px;
}
.stats-table {
width: 100%;
border-collapse: collapse;
margin-bottom: 20px;
}
.stats-table th, .stats-table td {
border: 1px solid #c4a482;
padding: 8px 12px;
text-align: center;
font-size: 14px;
}
.stats-table th {
background-color: rgba(140, 90, 50, 0.15);
color: #4a280e;
}
.team-header-1 { color: #c0392b; font-weight: bold; }
.team-header-2 { color: #2980b9; font-weight: bold; }
.stamp-winner {
position: absolute;
top: 15px;
right: 25px;
border: 4px double #27ae60;
color: #27ae60;
font-size: 22px;
font-weight: bold;
padding: 4px 15px;
transform: rotate(12deg);
border-radius: 8px;
}
</style>
</head>
<body>
<div id="game-container">
<!-- HUD -->
<div id="hud" class="hidden">
<div id="hud-team1" class="team-hud">
<div style="font-weight: bold; color: #ff6b6b;" id="t1-name">Đội 1</div>
<div id="t1-balls-info"></div>
</div>
<div id="hud-team2" class="team-hud" style="text-align: right;">
<div style="font-weight: bold; color: #4ecdc4;" id="t2-name">Đội 2</div>
<div id="t2-balls-info"></div>
</div>
</div>
<!-- CANVAS -->
<canvas id="gameCanvas" width="1000" height="680"></canvas>
<!-- MAIN MENU / SELECTION -->
<div id="menu-overlay" class="overlay">
<h1>BALL BATTLE SIMULATOR</h1>
<div class="mode-select">
<button class="btn" id="btn-mode-1v1" onclick="setMode('1v1')">Chế độ 1v1</button>
<button class="btn" id="btn-mode-2v2" onclick="setMode('2v2')">Chế độ 2v2</button>
</div>
<div class="team-select-container">
<!-- Team 1 Selection -->
<div class="team-box">
<h3 style="color:#ff6b6b">ĐỘI 1</h3>
<div id="team1-picker" class="ball-picker-grid"></div>
</div>
<!-- Team 2 Selection -->
<div class="team-box">
<h3 style="color:#4ecdc4">ĐỘI 2</h3>
<div id="team2-picker" class="ball-picker-grid"></div>
</div>
</div>
<div>
<label style="color:#f39c12; font-weight:bold;">Bản đồ: </label>
<select id="map-select" style="padding:5px; border-radius:5px; background:#271a12; color:#fff; border:1px solid #6e472b;">
<option value="normal">Thường (Chuẩn)</option>
<option value="universe">Vũ Trụ (Có Quá Tải)</option>
</select>
</div>
<button class="btn" style="margin-top:20px; font-size:20px; padding:12px 40px;" onclick="startGame()">BẮT ĐẦU TRẬN ĐẤU</button>
</div>
<!-- POST-MATCH STATS OVERLAY -->
<div id="stats-overlay" class="overlay hidden">
<div class="notebook-modal">
<div class="stamp-winner" id="winner-stamp">CHIẾN THẮNG!</div>
<div class="notebook-title">📝 BẢNG THỐNG KÊ SAU TRẬN 📝</div>
<p style="text-align: center; font-size: 13px; color: #664422; margin-bottom: 15px;">
Chi tiết hiệu quả chiến đấu của từng Ball trong trận đấu
</p>
<table class="stats-table">
<thead>
<tr>
<th>Đội</th>
<th>Tên Ball</th>
<th>Sát thương thực tế</th>
<th>HP đã hồi hiệu quả</th>
<th>Lá chắn đã tạo</th>
</tr>
</thead>
<tbody id="stats-table-body">
<!-- Populated dynamically -->
</tbody>
</table>
<div style="text-align: center; margin-top: 15px;">
<button class="btn" onclick="restartGame()">Đấu Lại</button>
<button class="btn" onclick="returnToMenu()">Về Menu Chính</button>
</div>
</div>
</div>
</div>
<script>
/* --- GAME ENGINE & CONFIG --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let gameMode = '1v1';
let isRunning = false;
let selectedT1 = [];
let selectedT2 = [];
let gameMap = 'normal';
let balls = [];
let particles = [];
let statsRecorder = {};
// Available Ball Types Definition
const BALL_TYPES = {
salamander: {
id: 'salamander', name: 'Salamander', role: 'Hỗ Trợ', color: '#ff4500',
baseHp: 95, baseDmg: 5, baseSpeed: 5, radius: 24,
desc: 'Phân tách bản sao, Lá Chắn Lửa, tích Hoả Ngục đốt thiêu địch'
},
ruby: {
id: 'ruby', name: 'Ruby Ball', role: 'Đặc Biệt', color: '#e74c3c',
baseHp: 110, baseDmg: 7, baseSpeed: 4.5, radius: 25,
desc: 'Cân bằng HP trung bình cộng với đồng đội (Sàn HP luôn >= 3)'
},
gambler: {
id: 'gambler', name: 'Gambler Ball', role: 'Đa Năng', color: '#9b59b6',
baseHp: 90, baseDmg: 6, baseSpeed: 5.2, radius: 23,
desc: 'Đổ xúc xắc gây dmg/buff (Ưu tiên đồng minh khác Salamander con)'
},
hades: {
id: 'hades', name: 'Hades Ball', role: 'Sát Thủ', color: '#2c3e50',
baseHp: 105, baseDmg: 9, baseSpeed: 4.8, radius: 25,
desc: 'Tước đoạt HP địch (Bị chặn bởi Lá Chắn Lửa)'
},
reaper: {
id: 'reaper', name: 'Reaper Ball', role: 'Truy Sát', color: '#8e44ad',
baseHp: 85, baseDmg: 8, baseSpeed: 5.5, radius: 22,
desc: 'Truy sát mục tiêu có vệt Linh Hồn'
},
basic: {
id: 'basic', name: 'Basic Ball', role: 'Đấu Sĩ', color: '#3498db',
baseHp: 100, baseDmg: 8, baseSpeed: 5, radius: 24,
desc: 'Chỉ số cân bằng, dễ dùng'
}
};
// Initialize Selection UI
function initMenuUI() {
const t1Container = document.getElementById('team1-picker');
const t2Container = document.getElementById('team2-picker');
t1Container.innerHTML = '';
t2Container.innerHTML = '';
Object.values(BALL_TYPES).forEach(b => {
t1Container.appendChild(createBallCard(b, 1));
t2Container.appendChild(createBallCard(b, 2));
});
// Default selections
selectedT1 = ['salamander'];
selectedT2 = ['ruby'];
if (gameMode === '2v2') {
selectedT1.push('hades');
selectedT2.push('gambler');
}
updateCardSelections();
}
function createBallCard(ball, teamNum) {
const card = document.createElement('div');
card.className = ball-card card-t${teamNum}-${ball.id};
card.innerHTML = <strong>${ball.name}</strong><br><span style="color:#aaa">${ball.role}</span>;
card.onclick = () => selectBall(ball.id, teamNum);
return card;
}
function setMode(mode) {
gameMode = mode;
if (mode === '1v1') {
selectedT1 = [selectedT1[0] || 'salamander'];
selectedT2 = [selectedT2[0] || 'ruby'];
} else {
if (selectedT1.length < 2) selectedT1.push('hades');
if (selectedT2.length < 2) selectedT2.push('gambler');
}
updateCardSelections();
}
function selectBall(id, teamNum) {
let list = teamNum === 1 ? selectedT1 : selectedT2;
const max = gameMode === '1v1' ? 1 : 2;
if (list.includes(id)) {
if (list.length > 1) list.splice(list.indexOf(id), 1);
} else {
if (list.length >= max) list.shift();
list.push(id);
}
updateCardSelections();
}
function updateCardSelections() {
document.querySelectorAll('.ball-card').forEach(c => c.classList.remove('selected'));
selectedT1.forEach(id => {
const el = document.querySelector(.card-t1-${id});
if (el) el.classList.add('selected');
});
selectedT2.forEach(id => {
const el = document.querySelector(.card-t2-${id});
if (el) el.classList.add('selected');
});
}
/* --- STATS TRACKER HELPER --- */
function initStatsTracker() {
statsRecorder = {};
balls.forEach(b => {
statsRecorder[b.id] = {
name: b.name,
team: b.team,
dmgDealt: 0,
effectiveHeal: 0,
shieldsCreated: 0,
isClone: b.isClone || false
};
});
}
function recordDamage(attackerId, amount) {
if (!attackerId || amount <= 0) return;
if (statsRecorder[attackerId]) {
statsRecorder[attackerId].dmgDealt += amount;
}
}
function recordHeal(healerId, amount) {
if (!healerId || amount <= 0) return;
if (statsRecorder[healerId]) {
statsRecorder[healerId].effectiveHeal += amount;
}
}
function recordShield(creatorId, amount) {
if (!creatorId || amount <= 0) return;
if (statsRecorder[creatorId]) {
statsRecorder[creatorId].shieldsCreated += amount;
}
}
/* --- BALL CLASS & LOGIC --- */
class Ball {
constructor(config, team, x, y, isClone = false, parent = null) {
this.id = 'ball_' + Math.random().toString(36).substr(2, 9);
this.type = config.id;
this.name = config.name + (isClone ? ' (Con)' : '');
this.team = team;
this.x = x;
this.y = y;
this.vx = (Math.random() - 0.5) * config.baseSpeed * 2;
this.vy = (Math.random() - 0.5) * config.baseSpeed * 2;
this.radius = config.radius;
this.maxHp = config.baseHp;
this.hp = config.baseHp;
this.baseDmg = config.baseDmg;
this.speed = config.baseSpeed;
this.color = config.color;
this.fireShield = 0;
this.infernoStacks = []; // { expireTime, dmgPerSec }
this.isClone = isClone;
this.splitGeneration = parent ? parent.splitGeneration + 1 : 0;
this.hasSoulTrail = false;
this.isOverloaded = false;
// Timers
this.timerSkill = 0;
this.timerSplit = 0;
// Salamander Initial Fire Shield
if (this.type === 'salamander' && !isClone) {
// Entry passive: Grant 20 fire shields to self and allies
setTimeout(() => this.applyEntryFireShield(), 100);
}
}
applyEntryFireShield() {
const teamBalls = balls.filter(b => b.team === this.team && b.hp > 0);
teamBalls.forEach(b => {
b.addFireShield(20, this.id);
});
}
addFireShield(amount, sourceId) {
this.fireShield += amount;
recordShield(sourceId || this.id, amount);
}
takeDamage(amount, attacker = null, isDirectHp = false) {
let actualDmgTaken = 0;
if (!isDirectHp && this.fireShield > 0) {
if (this.fireShield >= amount) {
this.fireShield -= amount;
actualDmgTaken = amount;
} else {
const leftover = amount - this.fireShield;
actualDmgTaken = amount;
this.fireShield = 0;
this.hp -= leftover;
}
// Fire shield attacker penalty
if (attacker) {
attacker.applyInfernoStack();
}
} else {
this.hp -= amount;
actualDmgTaken = amount;
}
if (attacker) {
recordDamage(attacker.id, actualDmgTaken);
}
if (this.hp < 0) this.hp = 0;
return actualDmgTaken;
}
heal(amount, healerId = null) {
const missingHp = this.maxHp - this.hp;
const effective = Math.min(missingHp, amount);
if (effective > 0) {
this.hp += effective;
recordHeal(healerId || this.id, effective);
}
}
applyInfernoStack() {
// 1 stack = 2 dmg/sec for 3 sec
this.infernoStacks.push({
endTime: Date.now() + 3000,
lastTick: Date.now()
});
}
update(dt) {
if (this.hp <= 0) return;
// Physics movement
this.x += this.vx;
this.y += this.vy;
// Bounce off walls
if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -1; }
// Process Inferno Burn Damage
const now = Date.now();
let activeStacks = 0;
let totalBurnRemaining = 0;
this.infernoStacks = this.infernoStacks.filter(stack => {
if (now < stack.endTime) {
activeStacks++;
const durationLeft = (stack.endTime - now) / 1000;
totalBurnRemaining += durationLeft * 2;
if (now - stack.lastTick >= 1000) {
// Tick 2 dmg bypassing shields directly to HP
this.takeDamage(2, null, true);
stack.lastTick = now;
}
return true;
}
return false;
});
// Instant Execution Check: if accumulated burn >= current HP -> instant execute!
if (totalBurnRemaining >= this.hp && this.hp > 0) {
this.takeDamage(this.hp, null, true);
this.infernoStacks = [];
createBurstFx(this.x, this.y, '#ff4500');
}
// Specific Ball Behaviors & Skills
this.handleSkillLogic(dt);
}
handleSkillLogic(dt) {
const now = Date.now();
// SALAMANDER SPLIT MECHANIC
if (this.type === 'salamander') {
const splitInterval = (this.isClone) ? 6000 : 5500;
if (!this.timerSplit) this.timerSplit = now;
if (now - this.timerSplit >= splitInterval && this.splitGeneration < 5) {
this.timerSplit = now;
this.splitSalamander();
}
}
// RUBY BALL AVERAGE HP MECHANIC
if (this.type === 'ruby') {
if (!this.timerSkill) this.timerSkill = now;
if (now - this.timerSkill >= 4000) {
this.timerSkill = now;
this.executeRubyAverageHp();
}
}
// GAMBLER BALL SKILL 1 (DICE ROLL)
if (this.type === 'gambler') {
if (!this.timerSkill) this.timerSkill = now;
if (now - this.timerSkill >= 4500) {
this.timerSkill = now;
this.executeGamblerDice();
}
}
}
splitSalamander() {
if (this.hp <= 0 || this.splitGeneration >= 5) return;
// Reduce size by 10% on split
this.radius = Math.max(12, this.radius * 0.9);
const inheritedHp = this.hp * 0.65;
this.hp = inheritedHp;
this.maxHp = inheritedHp;
// Spawn clone
const cloneConfig = {
id: 'salamander',
name: 'Salamander',
color: '#ff6347',
baseHp: inheritedHp,
baseDmg: this.baseDmg,
baseSpeed: this.speed,
radius: this.radius
};
const clone = new Ball(cloneConfig, this.team, this.x + 20, this.y + 20, true, this);
clone.hp = inheritedHp;
clone.maxHp = inheritedHp;
balls.push(clone);
// Register clone to stats recorder
statsRecorder[clone.id] = statsRecorder[this.id];
// Grant 12 Fire Shields to all team allies & clones
const teamMembers = balls.filter(b => b.team === this.team && b.hp > 0);
teamMembers.forEach(b => b.addFireShield(12, this.id));
// Reassign Soul Trail check
updateSoulTrails();
createBurstFx(this.x, this.y, '#ff4500');
}
executeRubyAverageHp() {
const teamMembers = balls.filter(b => b.team === this.team && b.hp > 0);
if (teamMembers.length <= 1) return;
let totalHp = 0;
teamMembers.forEach(b => totalHp += b.hp);
let avgHp = totalHp / teamMembers.length;
// FIX REQUIREMENT: Ruby Ball minimum HP is capped at 3 HP to prevent self-destruction
teamMembers.forEach(b => {
let targetHp = avgHp;
if (b.type === 'ruby' && targetHp < 3) {
targetHp = 3;
}
b.hp = Math.min(b.maxHp, Math.max(1, targetHp));
});
createBurstFx(this.x, this.y, '#e74c3c');
}
executeGamblerDice() {
// Gambler skill: roll dice damage/buff
// Requirement: Prioritize non-salamander clones for self/ally damage/buffs
const allies = balls.filter(b => b.team === this.team && b.hp > 0);
const nonSalamanderClones = allies.filter(b => !(b.type === 'salamander' && b.isClone));
const enemies = balls.filter(b => b.team !== this.team && b.hp > 0);
if (enemies.length === 0) return;
const roll = Math.floor(Math.random() * 6) + 1;
if (roll >= 4) {
// Deal damage to enemies
const target = enemies[Math.floor(Math.random() * enemies.length)];
target.takeDamage(15, this);
} else {
// Dice effect on allies: priority to non-Salamander clones
let targets = nonSalamanderClones;
if (targets.length === 0) {
// If ONLY Salamander clones exist, divide damage/effect equally
targets = allies;
}
const shareDmg = 10 / targets.length;
targets.forEach(t => t.takeDamage(shareDmg, this));
}
createBurstFx(this.x, this.y, '#9b59b6');
}
draw() {
if (this.hp <= 0) return;
ctx.save();
ctx.beginPath();
ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
ctx.fillStyle = this.color;
ctx.fill();
ctx.lineWidth = 2;
ctx.strokeStyle = '#fff';
ctx.stroke();
// Draw Fire Shield Aura
if (this.fireShield > 0) {
ctx.beginPath();
ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
ctx.strokeStyle = '#ff4500';
ctx.lineWidth = 3;
ctx.setLineDash([4, 4]);
ctx.stroke();
ctx.setLineDash([]);
}
// Draw Soul Trail indicator for Reaper
if (this.hasSoulTrail) {
ctx.beginPath();
ctx.arc(this.x, this.y, this.radius + 9, 0, Math.PI * 2);
ctx.strokeStyle = '#8e44ad';
ctx.lineWidth = 2;
ctx.stroke();
}
// Draw Name & HP
ctx.fillStyle = '#fff';
ctx.font = 'bold 11px Arial';
ctx.textAlign = 'center';
ctx.fillText(this.name, this.x, this.y - this.radius - 8);
// Draw Fire Shield count badge if present
if (this.fireShield > 0) {
ctx.fillStyle = '#ff4500';
ctx.fillText(🔥 ${Math.ceil(this.fireShield)}, this.x, this.y + this.radius + 14);
}
ctx.restore();
}
}
/* --- SOUL TRAIL MANAGER --- */
function updateSoulTrails() {
// Requirement: Only 1 single Salamander clone has the Soul Trail. If it dies, transfer to another.
const salamanderClones = balls.filter(b => b.type === 'salamander' && b.isClone && b.hp > 0);
salamanderClones.forEach(b => b.hasSoulTrail = false);
if (salamanderClones.length > 0) {
salamanderClones[0].hasSoulTrail = true;
}
}
/* --- COLLISION & HADES SPECIAL INTERACTION --- */
function handleCollisions() {
for (let i = 0; i < balls.length; i++) {
for (let j = i + 1; j < balls.length; j++) {
const b1 = balls[i];
const b2 = balls[j];
if (b1.hp <= 0 || b2.hp <= 0) continue;
const dx = b2.x - b1.x;
const dy = b2.y - b1.y;
const dist = Math.hypot(dx, dy);
const minDist = b1.radius + b2.radius;
if (dist < minDist) {
// Elastic bounce
const angle = Math.atan2(dy, dx);
const sin = Math.sin(angle);
const cos = Math.cos(angle);
// Separate balls
const overlap = minDist - dist;
b1.x -= cos * overlap * 0.5;
b1.y -= sin * overlap * 0.5;
b2.x += cos * overlap * 0.5;
b2.y += sin * overlap * 0.5;
// Velocity swap
const vx1 = b1.vx * cos + b1.vy * sin;
const vy1 = b1.vy * cos - b1.vx * sin;
const vx2 = b2.vx * cos + b2.vy * sin;
const vy2 = b2.vy * cos - b2.vx * sin;
b1.vx = vx2 * cos - vy1 * sin;
b1.vy = vy1 * cos + vx2 * sin;
b2.vx = vx1 * cos - vy2 * sin;
b2.vy = vy2 * cos + vx1 * sin;
// Deal Collision Damage if different teams
if (b1.team !== b2.team) {
applyCollisionDamage(b1, b2);
applyCollisionDamage(b2, b1);
}
// Universe mode touch overload clear rule
if (gameMap === 'universe') {
if (b1.type === 'salamander' && b2.type === 'salamander') {
balls.filter(b => b.type === 'salamander').forEach(s => s.isOverloaded = false);
}
}
}
}
}
}
function applyCollisionDamage(attacker, defender) {
let dmg = attacker.baseDmg;
// SPECIAL HADES INTERACTION WITH FIRE SHIELD:
// Hades CANNOT steal HP when Fire Shield is active!
// The theoretical stolen HP is deducted from Fire Shield as standard damage and applies 1 Hoả Ngục to Hades.
if (attacker.type === 'hades') {
if (defender.fireShield > 0) {
defender.takeDamage(dmg, attacker, false); // Triggers fire shield & inferno stack on Hades
} else {
const stolen = defender.takeDamage(dmg, attacker, true);
attacker.heal(stolen, attacker.id);
}
} else {
defender.takeDamage(dmg, attacker, false);
}
}
/* --- VISUAL FX PARTICLES --- */
function createBurstFx(x, y, color) {
for (let i = 0; i < 12; i++) {
particles.push({
x: x, y: y,
vx: (Math.random() - 0.5) * 6,
vy: (Math.random() - 0.5) * 6,
life: 1.0,
color: color
});
}
}
function updateParticles() {
particles.forEach(p => {
p.x += p.vx;
p.y += p.vy;
p.life -= 0.03;
});
particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
particles.forEach(p => {
ctx.save();
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
});
}
/* --- HUD & UI UPDATES --- */
function updateHUD() {
updateTeamHudDisplay(1, 't1-balls-info');
updateTeamHudDisplay(2, 't2-balls-info');
}
function updateTeamHudDisplay(teamNum, containerId) {
const container = document.getElementById(containerId);
const teamBalls = balls.filter(b => b.team === teamNum);
// Group Salamander clones aggregate health bar as specified
let html = '';
const salamanders = teamBalls.filter(b => b.type === 'salamander' && b.hp > 0);
const others = teamBalls.filter(b => b.type !== 'salamander');
if (salamanders.length > 0) {
const totalHp = salamanders.reduce((acc, b) => acc + b.hp, 0);
const totalMaxHp = salamanders.reduce((acc, b) => acc + b.maxHp, 0);
const pct = Math.max(0, Math.min(100, (totalHp / totalMaxHp) * 100));
html += <div style="margin-bottom:6px;"> <span style="font-size:12px;">Salamander Ball (${salamanders.length} con trên sân)</span> <div class="hp-bar-bg"> <div class="hp-bar-fill" style="width: ${pct}%;"></div> <div class="hp-text">${Math.ceil(totalHp)} / ${Math.ceil(totalMaxHp)}</div> </div> </div>;
}
others.forEach(b => {
const pct = Math.max(0, Math.min(100, (b.hp / b.maxHp) * 100));
html += <div style="margin-bottom:6px;"> <span style="font-size:12px;">${b.name}</span> <div class="hp-bar-bg"> <div class="hp-bar-fill" style="width: ${pct}%;"></div> <div class="hp-text">${Math.ceil(b.hp)} / ${Math.ceil(b.maxHp)}</div> </div> </div>;
});
container.innerHTML = html;
}
/* --- GAME LOOP & WIN CHECK --- */
function gameLoop() {
if (!isRunning) return;
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Draw Background Grid
ctx.strokeStyle = '#22150c';
ctx.lineWidth = 1;
for (let x = 0; x < canvas.width; x += 40) {
ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
}
for (let y = 0; y < canvas.height; y += 40) {
ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
}
// Update & Draw Balls
balls.forEach(b => b.update(0.016));
handleCollisions();
balls.forEach(b => b.draw());
updateParticles();
drawParticles();
updateHUD();
checkGameOver();
requestAnimationFrame(gameLoop);
}
function checkGameOver() {
const t1Alive = balls.filter(b => b.team === 1 && b.hp > 0).length;
const t2Alive = balls.filter(b => b.team === 2 && b.hp > 0).length;
if (t1Alive === 0 || t2Alive === 0) {
isRunning = false;
let winnerText = 'HÒA CỜ!';
if (t1Alive > 0 && t2Alive === 0) winnerText = 'ĐỘI 1 CHIẾN THẮNG!';
if (t2Alive > 0 && t1Alive === 0) winnerText = 'ĐỘI 2 CHIẾN THẮNG!';
showEndStats(winnerText);
}
}
/* --- POST-MATCH NOTEBOOK STATS BOARD DISPLAY --- */
function showEndStats(winnerText) {
document.getElementById('winner-stamp').innerText = winnerText;
const tbody = document.getElementById('stats-table-body');
tbody.innerHTML = '';
// Aggregate stats per original ball type per team
const summary = {};
Object.values(statsRecorder).forEach(stat => {
const key = ${stat.team}_${stat.name.replace(' (Con)', '')};
if (!summary[key]) {
summary[key] = {
team: stat.team,
name: stat.name.replace(' (Con)', ''),
dmgDealt: 0,
effectiveHeal: 0,
shieldsCreated: 0
};
}
summary[key].dmgDealt += stat.dmgDealt;
summary[key].effectiveHeal += stat.effectiveHeal;
summary[key].shieldsCreated += stat.shieldsCreated;
});
Object.values(summary).forEach(row => {
const tr = document.createElement('tr');
const teamClass = row.team === 1 ? 'team-header-1' : 'team-header-2';
tr.innerHTML = <td class="${teamClass}">Đội ${row.team}</td> <td><strong>${row.name}</strong></td> <td style="color:#c0392b; font-weight:bold;">${Math.round(row.dmgDealt)}</td> <td style="color:#27ae60; font-weight:bold;">${Math.round(row.effectiveHeal)}</td> <td style="color:#d96b27; font-weight:bold;">${Math.round(row.shieldsCreated)}</td>;
tbody.appendChild(tr);
});
document.getElementById('stats-overlay').classList.remove('hidden');
}
/* --- GAME START / RESTART --- */
function startGame() {
gameMap = document.getElementById('map-select').value;
document.getElementById('menu-overlay').classList.add('hidden');
document.getElementById('stats-overlay').classList.add('hidden');
document.getElementById('hud').classList.remove('hidden');
balls = [];
particles = [];
// Spawn Team 1
selectedT1.forEach((typeId, idx) => {
const cfg = BALL_TYPES[typeId];
const ball = new Ball(cfg, 1, 200, 200 + idx * 150);
balls.push(ball);
});
// Spawn Team 2
selectedT2.forEach((typeId, idx) => {
const cfg = BALL_TYPES[typeId];
const ball = new Ball(cfg, 2, 800, 200 + idx * 150);
balls.push(ball);
});
initStatsTracker();
updateSoulTrails();
isRunning = true;
requestAnimationFrame(gameLoop);
}
function restartGame() {
startGame();
}
function returnToMenu() {
isRunning = false;
document.getElementById('stats-overlay').classList.add('hidden');
document.getElementById('hud').classList.add('hidden');
document.getElementById('menu-overlay').classList.remove('hidden');
}
// Initialize UI on load
window.onload = () => {
initMenuUI();
};
</script>
